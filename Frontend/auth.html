<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access | Bingo Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee:wght@400&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="ambient-bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar landing-topbar">
    <a class="brand" href="index.html">Bingo Battles</a>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="authTitle">
      <p id="authEyebrow" class="eyebrow">Access Account</p>
      <h1 id="authTitle">Log In</h1>
      <p id="authSubtitle" class="auth-subtitle">Sign in to keep tracking your goals.</p>

      <form id="authForm" class="auth-form" novalidate>
        <label class="field-label" for="usernameInput">Username</label>
        <input id="usernameInput" name="username" class="field-input" type="text" autocomplete="username" required>

        <label class="field-label" for="passwordInput">Password</label>
        <input id="passwordInput" name="password" class="field-input" type="password" autocomplete="current-password" required>

        <button id="authSubmit" type="submit" class="btn btn-primary btn-lg auth-submit">Continue</button>
      </form>

      <a id="forgotPasswordLink" class="text-link" href="#">Forgot password?</a>
      <p id="authSwitchText" class="auth-switch"></p>
      <p id="authError" class="auth-error" role="alert" hidden></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
