<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | GoalGrid Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee:wght@400&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-page">
  <div class="ambient-bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar app-topbar">
    <a class="brand" href="dashboard.html">GoalGrid Bingo</a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <button id="navDashboard" class="nav-link is-active" type="button">Dashboard</button>
      <button id="navLeaderboard" class="nav-link" type="button">Leaderboard</button>
    </nav>

    <div class="menu-wrap">
      <button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-controls="menuPanel" type="button">
        <span></span><span></span><span></span>
        <span class="sr-only">Open account menu</span>
      </button>
      <div id="menuPanel" class="menu-panel" role="menu" hidden>
        <button id="createBoardMenu" role="menuitem" type="button">Create New BINGO Board</button>
        <button id="joinGroupMenu" role="menuitem" type="button">Join a Group</button>
        <button id="signOutMenu" role="menuitem" type="button">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="dashboardSection" class="view-panel" aria-labelledby="dashboardTitle">
      <div class="panel-head">
        <h1 id="dashboardTitle">Your Dashboard</h1>
        <p id="welcomeMessage">Welcome back!</p>
      </div>

      <div id="boardEmptyState" class="empty-state" hidden>
        <h2>No boards yet</h2>
        <p>Create your first BINGO board to start tracking progress.</p>
        <button id="createFirstBoard" class="btn btn-primary" type="button">Create a Board</button>
      </div>

      <div id="boardGrid" class="board-grid" aria-live="polite"></div>
    </section>

    <section id="leaderboardSection" class="view-panel" aria-labelledby="leaderboardTitle" hidden>
      <div class="panel-head">
        <h1 id="leaderboardTitle">Leaderboard</h1>
        <p>Ranked by progress percentage across active boards.</p>
      </div>

      <div class="leaderboard-shell">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
